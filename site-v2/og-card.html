<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=Newsreader:opsz,wght@6..72,400&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--ground:#F2F3EF;--surface:#FAFAF7;--sunk:#E8EAE4;--ink:#17201D;--ink-2:#47514C;--ink-3:#77817C;--rule:#D5D9D2;--sandbox:#3D5A80;--keys:#9C5F0E;--graph:#0E7563}
html,body{margin:0;width:1200px;height:630px;background:var(--ground);overflow:hidden}
.c{box-sizing:border-box;width:1200px;height:630px;padding:56px 64px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}
.brand{font:700 30px "Familjen Grotesk",sans-serif;color:var(--ink);letter-spacing:-.02em}.brand span{color:var(--ink-3);font-weight:400}
h1{margin:0;font:700 62px/1 "Familjen Grotesk",sans-serif;letter-spacing:-.035em;color:var(--ink);max-width:17ch}
.row{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
p{margin:18px 0 0;font:400 25px/1.4 Newsreader,Georgia,serif;color:var(--ink-2);max-width:30ch}
.fig{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px}
svg{display:block;width:100%;height:auto}
.foot{display:flex;gap:28px;font:400 17px "JetBrains Mono",monospace;color:var(--ink-3)}
.foot i{display:inline-block;width:22px;height:5px;border-radius:3px;margin-right:9px;vertical-align:4px}
</style></head><body><div class="c">
<div class="brand">skein<span>.nexus</span></div>
<div class="row"><div><h1>A computer with its own keys and a complete memory.</h1>
<p>A sandbox that holds its own keys, one signed door in and out, and a history you can branch and merge.</p></div>
<div class="fig"><svg viewBox="0 0 880 380" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/>
            </marker>
          </defs>
          <!-- outside world -->
          <g fill="var(--ink-2)">
            <text x="20" y="92">people</text>
            <text x="20" y="152">programs</text>
            <text x="20" y="212">other skeins</text>
            <text x="20" y="272">Bitcoin</text>
          </g>
          <g stroke="var(--ink-3)" stroke-width="1.3" fill="none" marker-end="url(#ah)" marker-start="url(#ah)">
            <path d="M118,88 C170,88 170,188 216,190"/>
            <path d="M118,148 C160,148 170,190 216,190"/>
            <path d="M118,208 C160,208 170,190 216,190"/>
            <path d="M88,268 C170,268 170,192 216,190"/>
          </g>
          <!-- skein boundary -->
          <rect x="232" y="30" width="628" height="320" rx="16" fill="var(--ground)" stroke="var(--ink)" stroke-width="2"/>
          <text x="252" y="56" fill="var(--ink)" font-family="Familjen Grotesk, system-ui, sans-serif" font-size="17" font-weight="600">a skein</text>
          <!-- door with keys -->
          <rect x="220" y="150" width="24" height="80" rx="5" fill="var(--keys)"/>
          <g transform="translate(262,172)">
            <circle cx="9" cy="9" r="7" fill="none" stroke="var(--keys)" stroke-width="2.4"/>
            <path d="M16,9 H40 M32,9 V16 M38,9 V14" stroke="var(--keys)" stroke-width="2.4" fill="none"/>
          </g>
          <text x="262" y="210" fill="var(--keys)" font-size="11.5">identity + wallet keys</text>
          <text x="262" y="226" fill="var(--ink-3)" font-size="11">sign out · verify in</text>
          <!-- sandbox -->
          <rect x="420" y="62" width="160" height="256" rx="10" fill="none" stroke="var(--sandbox)" stroke-width="1.6" stroke-dasharray="5 4"/>
          <text x="434" y="86" fill="var(--sandbox)" font-size="12">sandbox</text>
          <g font-size="12" fill="var(--ink)">
            <rect x="436" y="104" width="128" height="30" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
            <text x="448" y="123">shell · git</text>
            <rect x="436" y="144" width="128" height="30" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
            <text x="448" y="163">JS · Python</text>
            <rect x="436" y="184" width="128" height="30" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
            <text x="448" y="203">a model's turns</text>
            <rect x="436" y="224" width="128" height="30" rx="6" fill="var(--surface)" stroke="var(--rule)"/>
            <text x="448" y="243">your program</text>
          </g>
          <text x="434" y="290" fill="var(--ink-3)" font-size="11">no disk, network or</text>
          <text x="434" y="305" fill="var(--ink-3)" font-size="11">clock of its own</text>
          <!-- door to sandbox -->
          <path d="M246,190 H414" stroke="var(--keys)" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-dasharray="0" opacity=".9"/>
          <!-- sandbox to graph -->
          <path d="M584,190 H616" stroke="var(--graph)" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
          <!-- graph -->
          <text x="626" y="86" fill="var(--graph)" font-size="12">graph of history</text>
          <g stroke="var(--graph)" stroke-width="2" fill="none">
            <path d="M650,300 V120"/>
            <path d="M650,270 C650,250 705,255 705,235 V205 C705,185 650,185 650,165"/>
            <path d="M650,200 C650,180 790,190 790,165 V130"/>
          </g>
          <g fill="var(--graph)">
            <circle cx="650" cy="300" r="6"/><circle cx="650" cy="270" r="6"/><circle cx="650" cy="235" r="6"/>
            <circle cx="650" cy="200" r="6"/><circle cx="650" cy="165" r="6"/>
            <circle cx="705" cy="235" r="6"/><circle cx="705" cy="205" r="6"/>
            <circle cx="790" cy="165" r="6"/>
          </g>
          <g fill="var(--ground)" stroke="var(--graph)" stroke-width="2">
            <circle cx="650" cy="120" r="9"/><circle cx="790" cy="130" r="9"/>
          </g>
          <g font-size="11" fill="var(--ink-2)">
            <text x="664" y="124">head</text>
            <text x="716" y="224">branch</text>
            <text x="716" y="238">and merge</text>
            <text x="752" y="112">another head</text>
            <text x="664" y="304">genesis</text>
          </g>
        </svg></div></div>
<div class="foot"><span><i style="background:var(--sandbox)"></i>the sandbox</span><span><i style="background:var(--keys)"></i>keys and the door</span><span><i style="background:var(--graph)"></i>the graph</span></div>
</div></body></html>
